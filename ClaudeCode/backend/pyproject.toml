[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seetime-agent-backend"
version = "0.1.0"
description = "SeeTime Agent Backend API"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.28.0",
    "alembic>=1.11.0",
    "python-dotenv>=1.0.0",
    "websockets>=11.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
